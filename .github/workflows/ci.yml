name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build everything and run all tests
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/build.sh all
          ./scripts/test.sh
